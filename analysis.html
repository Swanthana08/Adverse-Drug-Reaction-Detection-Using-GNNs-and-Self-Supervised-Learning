<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url('static/static/bg.jpeg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
        }
        h1 {
            color: #5d5d5d;
        }
        h2 {
            color: #2c3e50;
        }
        .analysis-images img {
            max-width: 100%;
            height: auto;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        .notebook-container {
            margin-top: 30px;
            border: 2px solid #ddd;
            padding: 20px;
            background-color: #fff;
        }
        .notebook-container iframe {
            width: 100%;
            height: 600px;
            border: none;
        }
        .view-notebook-btn {
            background-color: #3498db;
            color: #fff;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            font-size: 16px;
            display: inline-block;
            margin-top: 20px;
        }
        .view-notebook-btn:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome, {{ username }}</h1>

        

        <!-- Notebook View -->
        <div class="notebook-container">
            <h2>View Jupyter Notebook:</h2>
            <!-- Embed notebook in an iframe -->
            <iframe src="{{ url_for('static', filename='your_notebook.html') }}" frameborder="0"></iframe>
        </div>
    </div>
</body>
</html>
