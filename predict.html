<!DOCTYPE html>
<html>
<head>
    <title>Drug Interaction Prediction</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: url('static/static/bg.jpeg') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
        }
        form {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: auto;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        input[type="submit"] {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #4CAF50;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        h2 {
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Predict Adverse Drug Reaction</h2>

    <form action="{{ url_for('predict') }}" method="POST">
        <label for="d1">Drug 1 ID:</label>
        <input type="text" id="d1" name="d1" required><br><br>
        
        <label for="d2">Drug 2 ID:</label>
        <input type="text" id="d2" name="d2" required><br><br>
        
        <label for="smiles1">SMILES for Drug 1:</label>
        <input type="text" id="smiles1" name="smiles1" required><br><br>
        
        <label for="smiles2">SMILES for Drug 2:</label>
        <input type="text" id="smiles2" name="smiles2" required><br><br>
        
        <button type="submit">Predict</button>
    </form>

</body>
</html>
